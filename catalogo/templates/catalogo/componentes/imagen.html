{% load static tienda %}{% with ruta_imagen=producto|imagen_producto %}{% if producto.foto %}<img class="imagen-producto" src="{{ producto|foto_subida }}" alt="{{ producto.nombre }}" loading="lazy" decoding="async">{% elif ruta_imagen %}<img class="imagen-producto" src="{% static ruta_imagen %}" alt="{{ producto.nombre }}" width="900" height="672" loading="lazy" decoding="async">{% else %}<svg class="ilustracion-producto" viewBox="0 0 240 200" role="img" aria-label="Ilustración de {{ producto.nombre }}"><use href="{% static 'catalogo/img/productos.svg' %}#{{ producto|ilustracion }}"></use></svg>{% endif %}{% endwith %}
