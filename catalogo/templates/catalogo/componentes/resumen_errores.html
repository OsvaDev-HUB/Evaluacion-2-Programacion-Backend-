{% if form.errors %}<div class="mensaje error" role="alert" tabindex="-1" data-error-formulario><strong>Revisa los datos del formulario.</strong>{{ form.non_field_errors }}<ul>{% for campo in form %}{% for error in campo.errors %}<li><a href="#{{ campo.id_for_label }}">{{ campo.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
