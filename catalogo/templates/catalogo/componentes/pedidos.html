{% load tienda %}<div class="lista-pedidos">{% for pedido in pedidos %}<article class="fila-pedido"><div><h3>Pedido #{{ pedido.id }}</h3><p>{{ pedido.fecha|slice:':10' }} · {{ pedido.contacto.nombre }}</p></div><span class="estado estado-disponible">Registrado · Demo</span><strong>{{ pedido.total|pesos }}</strong><a class="boton boton-secundario" href="{% url 'catalogo:pedido' pedido.id %}">Ver pedido</a></article>{% empty %}<div class="estado-vacio"><svg class="icono" aria-hidden="true"><use href="#i-box"/></svg><h3>Aún no hay pedidos</h3><p>Los pedidos confirmados aparecerán aquí.</p><a class="boton boton-primario" href="{% url 'catalogo:lista' %}">Ir a la tienda</a></div>{% endfor %}</div>
